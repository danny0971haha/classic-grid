name: ci

on:
  pull_request:
  push:
    branches: [main, "experiment/**"]

permissions:
  contents: read

jobs:
  compiler-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Record toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run check
      - name: Dependency audit inventory
        continue-on-error: true
        run: npm audit --json
